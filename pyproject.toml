[project]
name = "yamaha-chatbot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Core LangChain & LangGraph
    "langchain",
    "langchain-community",
    "langgraph",

    # AWS Bedrock
    "langchain-aws",

    # Environment & Settings
    "python-dotenv",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",

    # SQL & Database
    "SQLAlchemy>=2.0.35,<3",
    "aiosqlite>=0.20",
]
