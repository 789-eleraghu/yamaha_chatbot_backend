# ==============================================================================
# 6. Service & Data Layer Architecture Matrix
# ==============================================================================
service_matrix:
  - service_class: "BaseTelemetryService"
    location: "yamaha_chatbot_backend/src/services/telemetry/base.py"
    data_source: "ClickHouse (opcda_readings & tag_daily_energy_rollup)"
    description: "Authoritative industrial calculations: counter deltas, instantaneous metrics, shift boundaries, capability gating"

  - service_class: "FacilityTelemetryService (facility_telemetry)"
    location: "yamaha_chatbot_backend/src/services/telemetry/facility.py"
    data_source: "ClickHouse (11kV Grid Main Incomer, Solar 100kW, Transformers, PF, THD, Steam)"
    called_by_tools: ["get_energy_consumption", "get_facility_energy", "get_solar_generation", "get_power_factor", "get_power_quality_and_utilities", "get_shift_wise_consumption", "get_facility_shift_breakdown", "get_peak_demand_analysis"]

  - service_class: "GeneratorsTelemetryService (generators_telemetry)"
    location: "yamaha_chatbot_backend/src/services/telemetry/generators.py"
    data_source: "ClickHouse (DG 300kVA power & energy tags)"
    called_by_tools: ["get_dg_generator_status", "get_generator_daily_status"]

  - service_class: "EquipmentsTelemetryService (equipments_telemetry)"
    location: "yamaha_chatbot_backend/src/services/telemetry/equipments.py"
    data_source: "ClickHouse (8 standard equipment categories with mandatory exclusions)"
    called_by_tools: ["get_equipment_breakdown", "get_equipment_category_energy", "get_equipment_category_hourly_profile", "get_realtime_device_telemetry", "get_breakdown_summary"]

  - service_class: "ZonesTelemetryService (zones_telemetry)"
    location: "yamaha_chatbot_backend/src/services/telemetry/zones.py"
    data_source: "ClickHouse (17 organizational cost centers & meter mappings)"
    called_by_tools: ["get_zone_breakdown", "get_zone_cost_center_energy", "get_zone_hourly_profile", "get_breakdown_summary"]

  - service_class: "TariffService"
    location: "yamaha_chatbot_backend/src/services/tariff_service.py"
    data_source: "ClickHouse (hourly incomer readings) + tariff HT_1 TOD schedules"
    called_by_tools: ["get_cost_and_tariff", "create_breakdown_chart", "create_visualization"]

  - service_class: "RCAService"
    location: "yamaha_chatbot_backend/src/services/rca_service.py"
    data_source: "ClickHouse (multi-meter historical baselines and raw high-frequency readings)"
    called_by_tools: ["diagnose_high_consumption", "diagnose_spikes_and_anomalies", "explain_hourly_anomaly"]

  - service_class: "AggregationService"
    location: "yamaha_chatbot_backend/src/services/aggregation_service.py"
    data_source: "ClickHouse (tag_daily_energy_rollup & opcda_readings)"
    called_by_tools: ["create_visualization", "aggregate_energy_telemetry"]

  - service_class: "ChatRepository"
    location: "yamaha_chatbot_backend/src/db/chat_history.py"
    data_source: "SQLite (yamaha_mock.db)"
    called_by_tools: ["get_realtime_device_telemetry"]

  - service_class: "EMSKnowledgeBase"
    location: "yamaha_chatbot_backend/src/rag/retriever.py"
    data_source: "energy-ai-assistant-reference.md, EMS_DATA_COMPONENTS_AND_RULES.md, docs/components/*.md"
    called_by_tools: ["search_ems_knowledge_base"]
